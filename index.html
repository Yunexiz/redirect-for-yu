<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Preparing...</title>
	<link rel="preconnect" href="https://api.yunexiz.is-a.dev" />

	<style>
	  :root {
		--primary-text-color: #cccccc;

		--primary-background-color: black;
		--secondary-background-color: #111111;
		--tertiary-background-color: #181818;

		--primary-border-color: #222222;
	  }

	  * {
		box-sizing: border-box;
		margin: 0;
		font-family: Arial, sans-serif;
		color: var(--primary-text-color);
	  }

	  html, body {
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		gap: 30px;

		width: 100vw;
		height: 100vh;

		background-color: black;
	  }

	  #container {
		padding: 12px;

		background-color: var(--secondary-background-color);
		border: 1px solid var(--primary-border-color);
		border-radius: 20px;
	  }

	  #message {
		color: transparent;
		font-size: 5rem;

		background: linear-gradient(
		  to right,
		  var(--primary-text-color) 40%,
		  white 50%,
		  var(--primary-text-color) 60%
		);
		background-size: 200%;
		background-clip: text;

		animation: shine 1s linear infinite;
	  }

	  #loader {
		width: 64px;
		height: 64px;

		animation: spin 1s linear infinite;
	  }

	  @media (width < 768px) {
		#message {
		  font-size: 3rem;
		}

		#loader {
		  width: 48px;
		  height: 48px;
		}
	  }

	  @keyframes shine {
		from {
		  background-position: 100% 0;
		}
		to {
		  background-position: -100% 0;
		}
	  }

	  @keyframes spin {
		from {
		  transform: rotate(0deg);
		}
		to {
		  transform: rotate(360deg);
		}
	  }
	</style>

	<noscript>
      <meta
        http-equiv="refresh"
        content="3;url=https://yunexiz.is-a.dev"
        id="noscript-redirect"
      />
    </noscript>

	<script type="module">
	  const urlParams = new URLSearchParams(window.location.search);

	  const redirectUrl = new URL(
		urlParams.get("redirectUrl") || urlParams.get("redirect_url") || "https://yunexiz.is-a.dev/"
	  );
	  const excludedPassthroughParams = new Set(["redirectUrl", "redirect_url", "assetsBase", "assets_base", "discordUser", "discord_user"]);
	  redirectUrl.search = new URLSearchParams([...urlParams].filter(([key]) => !excludedPassthroughParams.has(key))).toString();

	  const assetsBase = urlParams.get("assetsBase") || urlParams.get("assets_base") || "origin"
	  const assetsUrl = new URL(
		assetsBase === "origin" ? redirectUrl.origin :
		assetsBase === "path" ? new URL(redirectUrl.pathname, redirectUrl.origin) :
		assetsBase === "full" ? redirectUrl :
		new URL(assetsBase, redirectUrl)
	  );

	  function redirectNow() {
		document.title = "Redirecting...";
		document.querySelector("#message").textContent = "Redirecting...";
		window.location.href = redirectUrl;
	  }

	  const tasks = [];

	  let tree = null;

	  try {
		const manifest = await fetch(new URL("assets.json", assetsUrl));
	    tree = await manifest.json();
	  } catch (error) {
		console.error("Failed to fetch manifest:", error);
	  }

	  async function walkArray(array, path) {
		if (!array) return;

		await Promise.all(array.map(async (node) => {
		  if (typeof node === "string") {
			await fetch(new URL(`${path}${node}`, assetsUrl)).then(() => {
			  console.log(`Fetched ${path}${node}`);
			})
		  } else if (typeof node === "object") {
			await walkArray(node.files, `${path}${node.dir}/`);
		  }
		}))
	  }

  	  if (Array.isArray(tree)) tasks.push(walkArray(tree, ""));
      else if (typeof tree === "object") tasks.push(walkArray(tree.files, `${tree.dir}/`));
      else console.error("Invalid tree");

	  const discordUser = urlParams.get("discordUser") ?? urlParams.get("discord_user") ?? "1040303561847881729";

	  async function fetchDiscordAvatar(discordUser) {
		const response = await fetch(`https://api.yunexiz.is-a.dev/v2/discord/user/${discordUser}`);

		const json = await response.json();

		return json?.avatar_url;
	  }

	  if (discordUser) {
        tasks.push(
          (async () => {
            try {
              const avatarUrl = await fetchDiscordAvatar(discordUser);

              if (avatarUrl) {
                redirectUrl.searchParams.set("avatarUrl", avatarUrl);
                await fetch(avatarUrl, { cache: "reload" });
                console.log("Fetched Discord avatar");
              }
            } catch (error) {
              console.error("Failed to fetch Discord avatar:", error);
            }
          })()
        );
	  } else {
		console.log("Discord avatar prefetch disabled");
	  }

	  setTimeout(redirectNow, 3000);
	  await Promise.all(tasks)
		.then(() => {
		  redirectNow();
		})
		.catch((error) => {
		  console.error("Failed to execute task:", error);
		})
	</script>
</head>
<body>
    <div id="container">
        <h1 id="message">Preparing...</h1>
    </div>
    <svg
      id="loader"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M21 12a9 9 0 11-6.219-8.56" />
    </svg>
</body>
</html>
